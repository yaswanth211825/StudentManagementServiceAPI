<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Records — QA Demo</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <p class="eyebrow">Local QA workspace</p>
    <h1>Student records</h1>
    <p class="notice">Use synthetic records only. Reload after each change to verify persistence.</p>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Create student</h2>
      <form id="student-form">
        <label>Name <input id="name" name="name" minlength="2" maxlength="50" required></label>
        <label>Email <input id="email" name="email" type="email" required></label>
        <button id="submit-button" type="submit">Create student</button>
        <button id="cancel-button" type="button" hidden>Cancel edit</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" aria-labelledby="records-title">
      <div class="section-heading">
        <h2 id="records-title">Saved records</h2>
        <button id="reload-button" type="button">Reload records</button>
      </div>
      <p id="empty-state" hidden>No student records yet.</p>
      <div class="table-wrap">
        <table id="student-table">
          <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Actions</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
